<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3ee">
  <title>Mch</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg?v=015c0946ade5">
  <link rel="stylesheet" href="css/style.css?v=home-fit-20261019">
  <!-- Deployment generates this manifest with cache_manager.py. The page also works without it. -->
  <script src="img/images.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到正文</a>
  <header class="site-header">
    <a class="logo" href="./" aria-label="Mch，返回首页">Mch</a>
    <nav class="site-nav" aria-label="主导航">
      <a href="/" aria-current="page">Home</a>
      <a href="article/" target="_blank" rel="noopener" aria-label="Articles (opens in a new tab)">Articles</a>
      <a href="https://mch.wang/todos" target="_blank" rel="noopener" aria-label="Todos (opens in a new tab)">Todos</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="main-content" class="home-main" tabindex="-1">
    <h1 class="visually-hidden">Mch</h1>
    <figure class="film-strip" aria-label="山海风景摄影胶片">
      <div class="film-screen">
        <div class="scenery-container" aria-hidden="true">
          <img class="scenery-fallback" src="img/life.png" alt="" fetchpriority="high">
        </div>
        <div class="film-controls">
          <button id="motion-toggle" type="button" aria-pressed="false" hidden>暂停播放</button>
        </div>
      </div>
      <figcaption class="visually-hidden">人生海海，山山而川。</figcaption>
    </figure>
  </main>

  <footer id="about" class="footnote">
    <span>Created By MchWang.</span>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">陕ICP备17021455号</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const screen = document.querySelector('.film-screen');
      const container = document.querySelector('.scenery-container');
      const fallback = document.querySelector('.scenery-fallback');
      const toggle = document.getElementById('motion-toggle');
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const manifest = Array.isArray(window.manifestImages) ? window.manifestImages : [];
      const sources = [...new Set([...manifest.filter(src => typeof src === 'string' && src.trim()), 'img/life.png'])];
      const failed = new Set();
      const loaded = new Map();
      let items = [];
      let tailX = 0;
      let lastSource = '';
      let loading = false;
      let manuallyPaused = false;
      let frame = 0;
      let previousTime = 0;

      const isPaused = () => manuallyPaused || motion.matches || document.hidden;

      function loadImage(src) {
        if (loaded.has(src)) return Promise.resolve(loaded.get(src));
        return new Promise(resolve => {
          const img = new Image();
          let settled = false;
          const timeout = setTimeout(() => finish(false), 8000);
          function finish(ok) {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            img.onload = null;
            img.onerror = null;
            if (ok && img.naturalWidth && img.naturalHeight) {
              loaded.set(src, img);
              resolve(img);
            } else {
              failed.add(src);
              img.removeAttribute('src');
              resolve(null);
            }
          }
          img.onload = () => finish(true);
          img.onerror = () => finish(false);
          img.src = src;
        });
      }

      async function nextImage() {
        const available = sources.filter(src => !failed.has(src));
        const preferred = available.filter(src => src !== lastSource);
        const choices = preferred.length ? preferred : available;
        if (!choices.length) return null;
        const start = Math.floor(Math.random() * choices.length);
        // A broken source is excluded for this page visit. Every attempt is bounded.
        for (let index = 0; index < choices.length; index++) {
          const src = choices[(start + index) % choices.length];
          const img = await loadImage(src);
          if (img) {
            lastSource = src;
            return img;
          }
        }
        // The previous image may be the only source that still loads.
        if (lastSource && !failed.has(lastSource)) return loaded.get(lastSource) || null;
        return null;
      }

      async function fillScreen() {
        if (loading) return;
        loading = true;
        try {
          if (!screen.clientHeight || !screen.clientWidth) return;
          // Cap work per pass even if a manifest contains extremely narrow images.
          let added = 0;
          while (tailX < screen.clientWidth + screen.clientHeight && added < 12) {
            const original = await nextImage();
            if (!original) break;
            const img = original.cloneNode();
            img.alt = '';
            const element = document.createElement('div');
            element.className = 'scenery-item';
            const ratio = original.naturalWidth / original.naturalHeight;
            const itemWidth = Math.max(1, screen.clientHeight * ratio);
            element.style.width = `${itemWidth}px`;
            element.style.transform = `translate3d(${tailX}px, 0, 0)`;
            element.appendChild(img);
            container.appendChild(element);
            items.push({ element, x: tailX, width: itemWidth, ratio });
            tailX += itemWidth;
            added++;
          }
          // Keep the static local photograph visible until the viewport is filled.
          fallback.hidden = tailX >= screen.clientWidth;
        } finally {
          loading = false;
        }
        updateMotion();
      }

      function animate(time) {
        frame = 0;
        if (isPaused() || !items.length) return;
        const elapsed = previousTime ? Math.min(time - previousTime, 50) : 0;
        previousTime = time;
        // Wait for the next photograph at the edge instead of revealing an empty frame.
        const distance = Math.min(elapsed * 0.065, Math.max(0, tailX - screen.clientWidth));
        for (const item of items) {
          item.x -= distance;
          item.element.style.transform = `translate3d(${item.x.toFixed(2)}px, 0, 0)`;
        }
        tailX -= distance;
        while (items.length && items[0].x + items[0].width < -1) {
          items.shift().element.remove();
        }
        if (tailX < screen.clientWidth + screen.clientHeight / 2 && !loading) fillScreen();
        if (!frame) frame = requestAnimationFrame(animate);
      }

      function updateMotion() {
        const paused = manuallyPaused || motion.matches;
        toggle.hidden = !items.length || motion.matches;
        toggle.textContent = paused ? '继续播放' : '暂停播放';
        toggle.setAttribute('aria-pressed', String(paused));
        screen.classList.toggle('is-paused', isPaused());
        if (isPaused()) {
          cancelAnimationFrame(frame);
          frame = 0;
          previousTime = 0;
        } else if (!frame && items.length) {
          previousTime = 0;
          frame = requestAnimationFrame(animate);
        }
      }

      function resizeFilm() {
        if (!items.length) {
          fillScreen();
          return;
        }
        const height = screen.clientHeight;
        // Reflow the existing photographs at their natural aspect ratios.
        let nextX = 0;
        for (const item of items) {
          item.x = nextX;
          item.width = Math.max(1, height * item.ratio);
          item.element.style.width = `${item.width}px`;
          item.element.style.transform = `translate3d(${nextX}px, 0, 0)`;
          nextX += item.width;
        }
        tailX = nextX;
        fillScreen();
      }

      toggle.addEventListener('click', () => {
        manuallyPaused = !manuallyPaused;
        updateMotion();
      });
      motion.addEventListener('change', updateMotion);
      document.addEventListener('visibilitychange', updateMotion);
      if ('ResizeObserver' in window) new ResizeObserver(resizeFilm).observe(screen);
      else window.addEventListener('resize', resizeFilm, { passive: true });
      fillScreen();
      updateMotion();
    });
  </script>
</body>
</html>
